plugins {
    id 'java'
    id 'application'
}

group = 'com.affiniti'
version = '1.0.0'

application {
    mainClass = 'Main'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Jackson for JSON parsing
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
}
